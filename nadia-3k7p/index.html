<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf9f6">
  <meta name="robots" content="noindex,nofollow">
  <title>Nadia's home search · Team Paley</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to homes</a>
  <div class="preview-ribbon"><span class="status-dot"></span>Private <span class="ribbon-dot">·</span> Prepared for Nadia by Team Paley</div>
  <div id="storage-warning" class="storage-warning" role="status" hidden>This browser isn't saving your progress. Keep the page open until you tap Send.</div>
  <header class="brand-header">
    <button class="brand" data-nav="homes" aria-label="Team Paley home search"><strong>TEAM PALEY</strong><span>CUSTOM HOME SEARCH</span></button>
    <div class="header-person"><span class="header-greeting">Made for Nadia</span><span class="initials" aria-label="Nadia">NL</span></div>
  </header>
  <main id="main" tabindex="-1"></main>
  <aside id="progress-bar" class="progress-bar" hidden></aside>
  <nav class="app-nav" aria-label="Main navigation"></nav>
  <dialog id="home-dialog" class="home-dialog" aria-labelledby="home-dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
